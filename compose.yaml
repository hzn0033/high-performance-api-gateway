services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      redis:
        condition: service_healthy
      demo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 5
  demo:
    build: .
    entrypoint: ["/app/demo"]
    command: ["-delay", "5ms"]
    healthcheck:
      test: ["CMD", "/app/grpc-check", "-target", "localhost:9091"]
      interval: 5s
      timeout: 4s
      retries: 5
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
